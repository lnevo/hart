# mypy settings for the repo's CPython code. tools/audit/check_mypy.py runs mypy with this file and decides
# which files it checks: every tracked .py file except
# - the folders and files ruff.toml's extend-exclude lists (vendored, archived and parked code, Jython 2 that
#   ruff cannot parse),
# - the Jython scripts ruff.toml gives an F821 ignore,
# - any file that imports jmri, java or javax,
# - the paths this file's `exclude` matches: Jython that runs inside JMRI or under both Jython 2.7 and CPython.
# hartlib (tools/hartlib/src) must have no errors. Every other file is held to tools/audit/mypy_baseline.json,
# whose per-file error counts may only go down.
[mypy]
python_version = 3.13
mypy_path = tools/hartlib/src
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
warn_unused_configs = True
exclude = (?x)(
    ^jmri/scripts/
    | ^jmri/layouts/hart/scripts/speedmatch/jython/
    | ^jmri/layouts/hart/scripts/speedmatch/(liverule|pom_guard|pom_guard_roster|pom_write)\.py$
  )

# Third-party packages count as untyped (Any) whether or not this machine has them installed, so the Mac, the
# Windows box and CI give the same per-file counts.
[mypy-PIL.*,mypy-docx.*,mypy-f5_tts_mlx.*,mypy-lxml.*,mypy-markdown.*,mypy-mlx.*,mypy-mlx_whisper.*,mypy-numpy.*,mypy-openpyxl.*,mypy-paho.*,mypy-pptx.*,mypy-pymupdf.*,mypy-fitz.*,mypy-pypdf.*,mypy-pytesseract.*,mypy-scipy.*,mypy-soundfile.*,mypy-trimesh.*,mypy-cv2.*,mypy-requests.*,mypy-yaml.*]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-hartlib.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
strict_equality = True
