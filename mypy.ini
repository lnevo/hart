# mypy settings for the repo's CPython code. tools/audit/check_mypy.py runs mypy with this file and decides
# which files it checks: every tracked .py file except
# - the folders and files ruff.toml's extend-exclude lists (vendored, archived and parked code, Jython 2 that
#   ruff cannot parse),
# - the Jython scripts ruff.toml gives an F821 ignore,
# - any file that imports jmri, java or javax,
# - the paths this file's `exclude` matches: Jython that runs inside JMRI or under both Jython 2.7 and CPython.
# The packages a [mypy-<package>.*] section gives disallow_untyped_defs = True are strict and must have no errors;
# check_mypy reads those sections as its list of strict folders, and a section that sets the option to False keeps a
# folder inside one in basic mode. Every other file is held to tools/audit/mypy_baseline.json, whose per-file error
# counts may only go down.
[mypy]
python_version = 3.13
mypy_path = tools/hartlib/src
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
# Installed packages are never read, so third-party imports are untyped (Any) on every machine and the Mac, the
# Windows box and CI give the same per-file counts.
no_site_packages = True
follow_imports = silent
check_untyped_defs = False
warn_unused_configs = True
exclude = (?x)(
    ^jmri/scripts/
    | ^jmri/layouts/hart/scripts/speedmatch/jython/
    | ^jmri/layouts/hart/scripts/speedmatch/(liverule|pom_guard|pom_guard_roster|pom_write)\.py$
  )


[mypy-hartlib.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
strict_equality = True

# tools/audit is held to hartlib's strict options. Its tests (tools/audit/tests) stay in basic mode, as
# tools/hartlib/tests do.
[mypy-tools.audit.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
strict_equality = True

[mypy-tools.audit.tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
warn_unused_ignores = False
strict_equality = False

# tools/ops is held to hartlib's strict options.
[mypy-tools.ops.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
strict_equality = True
