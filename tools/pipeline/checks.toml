# Every output drawn from the schematic, checked by its own pipeline (make panels CHECK=1): each step of
# tools/schematic/build_panels.sh (tools/pipeline/panels.toml) with --check, in build order, from the hands to the
# approved fingerprints, with
# tables.xml among them (an output, ADR-029: a Store is never copied over it; make tables-pull and split_store.py).
# One list of panel checks for check.sh, CI and make panels. Its own stamps (shared with make panels) skip the steps
# current here; CI, FULL=1 and an audit run pass --full and run them all, and so does a run with HART_TABLES (stamps
# off; the table steps read that file). Fails when the schematic-maps plugin submodule is not checked out, even with
# SCHEMATIC_REQUIRED=0: its schematic step (publish_draft.py --check) has no SKIPPED path.
[[step]]
name = "panels"
runner = "check"
group = "static"
# check.sh adds --full when its stamps are off (CI, FULL=1, an audit run): the panel steps skip nothing then
cmd = ["bash", "tools/schematic/build_panels.sh", "--check"]
domain = "layout"
label = "build_panels.sh (make panels)"
desc = "make panels: runs the schematic builders and guards in order (hands to CATS: head-plan and panel-items steps and the sml-current guard included), skipping a step whose stamped inputs are unchanged (FULL=1 runs all)."
# not a repo path, so not listed: writes ext:panel-stamps (records a stamp after a step passes)
# not a repo path, so not listed: ext:panel-stamps (skips a current step)
# Its links to the steps it runs, and the guards' links back to it, come from tools/pipeline/panels.toml.
inputs = [
  { path = "tools/pipeline/panels.toml", label = "the steps, in order" },
]

