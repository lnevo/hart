# The read-only checks tools/check.sh runs, one [[step]] each (ADR-037, docs/pipeline-map/build-graph-design.md).
# tools/check.sh and tools/ci/docs_checks.sh run what is listed here, through `tools/pipeline/manifest.py jobs check`;
# a file that does not load, or a list with no step, stops them before any job. To add a check, add a [[step]] and run
# `python3 tools/pipeline/manifest.py check` (docs/pipeline-map/checks-and-remote.md). Every step is a job of its own
# under its name (ADR-037 stage 4b), and each job's stamp key holds its own entry, so an edit here reruns only the job
# it changes.
#
# Fields (manifest.py checks each one and refuses any other):
#   name        the job name as check.sh prints it; stamps key on it, so a rename reruns the check once
#   runner      "check" (a tools/check.sh job)
#   group       "static" for the read-only checks check.sh queues ahead of the unit tests (python3 or bash); a step
#               without a group is queued after them and may run "{python}" (public-text, ruff, portal)
#   cmd         argv. "{python}" is check.sh's $HOPS_PY (ops/hart-ops/.venv's Python, which has pypdf). A
#               "PYTHONPATH=dir" word after "env" keeps the caller's PYTHONPATH after dir, as check.sh does (the trace
#               hook is on it); the -m module must be a file under dir
#   domain      the map lane (a domain of docs/pipeline-map/pipeline_map.json); label and desc are the map box's
#               name and text: the map draws each step's script as a box, with its inputs, outputs and an edge to
#               tools/check.sh, from this file (tools/pipeline/map_lane.py, "gen": "manifest" in the map); one box
#               per script, so two steps may not run one script; each input and output must be a box of the map
#   git         the git refs the job's stamp key holds, so that it reruns when one moves: "head" (HEAD), "base" (its
#               merge base with origin/main), "origin" (origin/main); [] for none. Required, so each step says it. A
#               read-only git command the step runs is replayed at compare time whatever this says; a ref is for what
#               the trace cannot replay: git read by bash or by a file under .git, a clone of HEAD. ["head", "base"]
#               until the step's trace shows it reads git only through commands it replays, then [] with the reason
#               in a comment (check_stamps.py: a wrongly skipped check is the worst failure here)
#   docs_only   also run on the docs-only path (tools/ci/docs_checks.sh)
#   after_edit  also run by .claude/hooks/check_after_edit.py after an edit to tables.xml or the signal files;
#               keep these quick (the hook has 20 s for all of them) and free of "{python}"
#   inputs      what the step reads, as map edges into its script: a path or glob, or { path, label, side }, side
#               one of the map's edge sides ("check": a check or comparison reads it)
#   outputs     what the step writes when run without --check (the map's edges out of its script)
#   programs    a program the trace cannot see into, and the files it reads
#   quiet_inputs  paths or globs the step reads that the map does not draw (tables.xml or the device master read
#               through hartlib by many scripts, or the files a scanner walks); only the trace audit reads them. A
#               path is in inputs or here, not both. A glob must match a tracked file. A scanner's globs are its
#               script's own scan list (its SCAN_GLOBS; tools/audit/tests/test_manifest_scans.py keeps the two equal)
#   reads_all   why the script reads every tracked file: only then may quiet_inputs hold "**/*" (public-text)
# After each traced pass of a job, tools/audit/check_stamps.py prints a WARNING naming each repo file a step read as
# data that is in none of inputs, quiet_inputs, outputs and programs (the code it imported or ran, which the trace
# marks, is left out; a .py file or a file under tools/ read as text is not);
# `python3 tools/audit/check_stamps.py audit [job]` shows it again from the job's last stamp (ADR-037 stages 4a, 4c).
# Every path is from the repo root and names a tracked file or folder, or a map node marked "local". Inputs and
# outputs were filled once from the map's edges (2026-11-25): code the script imports or is called by is left out,
# and a map node with no repo path (ext:...) is named in a comment instead.

[[step]]
name = "phase02"
runner = "check"
group = "static"
after_edit = true
cmd = ["python3", "jmri/scripts/check_hart_phase02.py"]
# git = []: its trace (2026-11-25) shows one Python process that runs no git and opens nothing under .git, so
# its read set holds all it reads; HEAD in its key only reran it after every commit (ADR-037 stage 4b)
git = []
domain = "layout"
label = "check_hart_phase02.py"
desc = "Acceptance checks for phases 0-2: tables.xml against the device master (devices_generated.csv and devices_field.csv) and switches.csv (check.sh phase02)."
inputs = [
  { path = "jmri/layouts/hart/data/devices_field.csv", label = "device master", side = "check" },
  { path = "jmri/layouts/hart/data/devices_generated.csv", label = "device master", side = "check" },
  { path = "jmri/layouts/hart/data/switches.csv", label = "staging rows, via hartlib.railroad" },
  { path = "jmri/layouts/hart/output/tables.xml", label = "checks", side = "check" },
]
quiet_inputs = ["jmri/layouts/hart/data/schematic/interlockings.csv",
                "jmri/layouts/hart/data/schematic/stations.csv"]

