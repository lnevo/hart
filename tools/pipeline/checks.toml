# Every Markdown document under docs/ needs a summary line (see summarize() in the script).
[[step]]
name = "docs-index"
runner = "check"
group = "static"
cmd = ["python3", "tools/ops/build_docs_index.py", "--check", "--strict"]
domain = "extras"
label = "build_docs_index.py"
desc = "Lists git-tracked docs/ documents newest first into docs/INDEX.md; --check in tools/check.sh."
docs_only = true
inputs = [
  "docs",
]
outputs = [
  "docs/INDEX.md",
]

[[step]]
name = "desks"
runner = "check"
group = "static"
cmd = ["python3", "cats/scripts/validate_cats_panel.py"]
domain = "layout"
label = "validate_cats_panel.py"
desc = "Validates desks (make desks and check.sh); with cats_turnout_io and digicon_lib loaders."
inputs = [
  { path = "cats/panels/HART_CTC.xml", label = "make desks check", side = "check" },
]

[[step]]
name = "public-text"
runner = "check"
cmd = ["{python}", "tools/audit/check_public_text.py"]
domain = "extras"
label = "check_public_text"
desc = "Audit of public site and card text for private or banned wording."
docs_only = true
inputs = [
  { path = "www", label = "check", side = "check" },
]

[[step]]
name = "ruff"
runner = "check"
cmd = ["python3", "tools/audit/check_ruff.py"]
domain = "extras"
label = "check_ruff"
desc = "Pyflakes (ruff F rules, ruff.toml) over every .py file; the edit hook runs it on each edited file."
# ruff is a program the trace cannot see into: what it reads (check_stamps.BY_KIND["ruff"])
programs = { ruff = ["**/*.py", "ruff.toml", "requirements.txt", ".gitignore", "**/.gitignore"] }

# check.sh queues it only off CI and when tools/audit/portal_inputs.py does not exit 3 (no site input changed), or
# with PORTAL_CHECK=1; the condition is in check.sh, keyed on this step's name
[[step]]
name = "portal"
runner = "check"
cmd = ["python3", "www/scripts/check_portal_build.py"]
domain = "website"
label = "check_portal_build.py"
desc = "Smoke-tests built tree: internal href/src and data JSON link fields resolve; writes manifest and compares counts; runs share_cards check."
# not a repo path, so not listed: ext:site-dist (--dist)
inputs = [
  { path = ".deploy-manifest.json", label = "--previous" },
  { path = "www/scripts/share_cards.py", label = "check", side = "check" },
]
