# Every output drawn from the schematic, checked by the steps of make panels (tools/pipeline/panels.toml), from the
# hands to the approved fingerprints, with tables.xml among them (an output, ADR-029: a Store is never copied over
# it; make tables-pull and split_store.py). check.sh does not run this command: this step stands for one job per step
# of panels.toml, panels-<step>, which runs that step's check (its cmd and check_args) under check.sh's own trace and
# stamps (ADR-037 stage 6; tools/pipeline/manifest_jobs.py panel_jobs). A check writes nothing, so the jobs run side
# by side in any order; make panels CHECK=1 (this command) still runs them in build order with make panels' stamps.
# Each job's key holds its panels.toml entry and this one, the step's outputs and make panels' code
# (panel_stamps.CODE) whole, and the merge base for a step that publishes; with HART_TABLES set nothing is skipped.
# A step fails when the schematic-maps plugin submodule is not checked out (SCHEMATIC_REQUIRED=1, as in CI).
