# The read-only checks tools/check.sh runs, one [[step]] each (ADR-037, docs/pipeline-map/build-graph-design.md).
# tools/check.sh and tools/ci/docs_checks.sh run what is listed here, through `tools/pipeline/manifest.py jobs check`;
# a file that does not load, or a list with no step, stops them before any job. To add a check, add a [[step]] and run
# `python3 tools/pipeline/manifest.py check` (docs/pipeline-map/checks-and-remote.md). Each job's stamp key holds its
# own entries (all of the static group's for "static"), so an edit here reruns only the job it changes.
#
# Fields (manifest.py checks each one and refuses any other):
#   name        the job name as check.sh prints it; stamps key on it, so a rename reruns the check once
#   runner      "check" (a tools/check.sh job)
#   group       "static" for the checks that run one after another as check.sh's one "static" job, in this order; a
#               step without a group is a job of its own (public-text, ruff, portal)
#   cmd         argv. "{python}" is check.sh's $HOPS_PY (ops/hart-ops/.venv's Python, which has pypdf). A
#               "PYTHONPATH=dir" word after "env" keeps the caller's PYTHONPATH after dir, as check.sh does (the trace
#               hook is on it); the -m module must be a file under dir
#   domain      the map lane (a domain of docs/pipeline-map/pipeline_map.json); label and desc are the map box's
#               name and text: the map draws each step's script as a box, with its inputs, outputs and an edge to
#               tools/check.sh, from this file (tools/pipeline/map_lane.py, "gen": "manifest" in the map); one box
#               per script, so two steps may not run one script; each input and output must be a box of the map
#   docs_only   also run on the docs-only path (tools/ci/docs_checks.sh)
#   inputs      what the step reads, as map edges into its script: a path or glob, or { path, label, side }, side
#               one of the map's edge sides ("check": a check or comparison reads it)
#   outputs     what the step writes when run without --check (the map's edges out of its script)
#   programs    a program the trace cannot see into, and the files it reads
# Every path is from the repo root and names a tracked file or folder, or a map node marked "local". Inputs and
# outputs were filled once from the map's edges (2026-11-25): code the script imports or is called by is left out,
# and a map node with no repo path (ext:...) is named in a comment instead.

[[step]]
name = "phase02"
runner = "check"
group = "static"
cmd = ["python3", "jmri/scripts/check_hart_phase02.py"]
domain = "layout"
label = "check_hart_phase02.py"
desc = "Acceptance checks for phases 0-2: tables.xml against the device master (devices_generated.csv and devices_field.csv) and switches.csv (check.sh phase02)."
inputs = [
  { path = "jmri/layouts/hart/data/switches.csv", label = "staging rows, via hartlib.railroad" },
  { path = "jmri/layouts/hart/output/tables.xml", label = "checks", side = "check" },
]

