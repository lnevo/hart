[[step]]
name = "py-sizes"
runner = "check"
group = "static"
cmd = ["python3", "tools/audit/check_py_sizes.py"]
git = ["head", "base"]
domain = "extras"
label = "check_py_sizes"
desc = "Fails when a .py or .js file over 800 lines, or a .sh file over 500, grows past its row in tools/audit/py_sizes.csv; warns at 90 percent of the limit; a shrink passes with a note; --update tightens the list, --accept raises a row by name."
inputs = [
