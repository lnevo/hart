<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HART LCOS mimic</title>
  <link rel="stylesheet" href="/mimic.css" />
  <script src="/mimic_view.js"></script>
</head>
<body data-heads-title="Signal heads (live MQTT)">
  <footer>
    Mimics LCOS status: <code>track/turnout/{addr}</code> plus FB N/R sensors for TWOSENSOR plants.
    Occupancy is <code>track/sensor/{addr}</code>. Does not publish <code>track/cmd</code> (motors stay put).
  </footer>
  <script>
    // Markup, style and render() come from mimic_view.js and mimic.css; this script is the transport.
    mountMimic();

    async function post(url, body) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.ok === false) throw new Error(j.error || r.statusText);
    }

    document.addEventListener("click", async (e) => {
      const to = e.target.closest("[data-to]");
      if (to) {
        await post("/api/turnout", { addr: to.dataset.to, state: to.dataset.st });
        return;
      }
      const occ = e.target.closest("[data-occ]");
      if (occ) {
        await post("/api/occupancy", { addr: occ.dataset.occ, state: occ.dataset.st });
      }
    });

    $("clear-occ").addEventListener("click", async () => {
      if (!confirm("Set every occupancy sensor INACTIVE?")) return;
      await post("/api/occupancy/clear", {});
    });

    function applyEvent(ev) {
      if (ev.type === "sensor") state.sensors[ev.addr] = ev.payload;
      if (ev.type === "turnout") state.turnouts[ev.addr] = ev.payload;
      if (ev.type === "head") state.heads[ev.addr] = ev.payload;
      if (ev.type === "mqtt") showMqtt(ev);
      if (ev.type === "warning") $("mqtt-label").textContent = `MQTT warning: ${ev.error} in ${ev.line}`;
    }

    // Connected, waiting (running, no traffic yet: a neutral dot) or disconnected with its reason.
    function showMqtt(m) {
      $("mqtt-dot").className = "dot " + (m.connected ? "ok" : m.waiting || !m.error ? "" : "bad");
      $("mqtt-label").textContent = m.connected ? `MQTT ${m.host || ""}`
        : m.error ? `MQTT disconnected ${m.error}` : `MQTT ${m.host || ""} (waiting)`;
    }

    async function boot() {
      const [layout, snap] = await Promise.all([
        fetch("/api/layout").then(r => r.json()),
        fetch("/api/state").then(r => r.json()),
      ]);
      state.layout = layout;
      Object.assign(state.sensors, snap.sensors || {});
      Object.assign(state.turnouts, snap.turnouts || {});
      Object.assign(state.heads, snap.heads || {});
      if (snap.mqtt) showMqtt(snap.mqtt);
      else $("mqtt-label").textContent = "MQTT unknown";
      render();
      const es = new EventSource("/api/events");
      let renderTimer = 0;
      const scheduleRender = () => {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(render, 40);
      };
      es.onmessage = (m) => {
        try {
          applyEvent(JSON.parse(m.data));
          scheduleRender();
        } catch (err) { console.warn(err); }
      };
      es.onerror = () => {
        $("mqtt-dot").className = "dot bad";
      };
    }
    boot();
  </script>
</body>
</html>
