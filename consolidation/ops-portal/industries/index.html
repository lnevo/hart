<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industries — HART</title>
  <link rel="stylesheet" href="../css/ops.css">
</head>
<body>
  <header class="site-header" data-ops-header></header>
  <main>
    <div class="page-head">
      <h1 id="ind-title">Industries</h1>
      <p class="muted" id="ind-lede"></p>
      <p class="small">Shenango, Kosmos, Calgon, and Aristech all came out of one plant. The <a href="../plants/index.html">Industry</a> chart traces each one.</p>
      <p class="small">Working a session? The <a href="../crew/industries/index.html">industry spot sheets</a> show which car goes on which spot.</p>
    </div>
    <div class="industry-grid" id="ind-grid"></div>
  </main>
  <footer class="site-footer" data-ops-footer></footer>
  <script src="../js/nav.js"></script>
  <script>
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    // Anchors on the crew spot-sheet page (crew/industries/).
    var SPOTS = {
      "Aristech Plastics": "aristech",
      "A. Stucki Company": "stucki",
      "Calgon Carbon": "calgon",
      Ferrellgas: "ferrellgas",
      "Kosmos Cement": "kosmos",
      "Shenango Coke Works": "shenango",
      Interchange: "scully",
    };
    // Destination colors (data/crew.json) for the stripe under each logo, as on the printed operator sheet.
    var STRIPES = {
      "Aristech Plastics": ["yellow"],
      "A. Stucki Company": ["green"],
      "Calgon Carbon": ["purple"],
      Ferrellgas: ["red"],
      "Kosmos Cement": ["pink"],
      "Shenango Coke Works": ["black"],
      Interchange: ["orange", "blue"],
    };
    // The operator sheet prints a deeper yellow; pure #FFFF00 washes out as a thin rule.
    var PRINT_HEX = { yellow: "#FFD400" };
    document.addEventListener("DOMContentLoaded", async function () {
      await HARTOps.mountChrome("industries");
      var data = await HARTOps.loadJson("data/industries.json");
      var crew = await HARTOps.loadJson("data/crew.json");
      var colors = {};
      (crew.colors || []).forEach(function (c) {
        colors[c.id] = c;
      });
      document.getElementById("ind-title").textContent = data.title;
      document.getElementById("ind-lede").textContent = data.lede || "";
      document.getElementById("ind-grid").innerHTML = (data.industries || [])
        .map(function (ind) {
          var logoSrc = ind.logo
            ? ind.logo.indexOf("../external/") === 0
              ? ind.logo.replace(/^\.\.\//, HARTOps.base() === "../" ? "../../" : "../")
              : HARTOps.base() + ind.logo
            : "";
          var logo = logoSrc
            ? '<div class="logo-band"><img class="logo" src="' +
              esc(logoSrc) +
              '" alt="' +
              esc(ind.name) +
              ' logo"></div>'
            : '<div class="logo-band"><span class="meta">No logo on file</span></div>';
          var stripes = (STRIPES[ind.name] || [])
            .filter(function (id) {
              return colors[id];
            })
            .map(function (id) {
              var c = colors[id];
              return '<span style="background:' + esc(PRINT_HEX[id] || c.hex) + '" title="' + esc(c.label + " · " + c.dest) + '"></span>';
            })
            .join("");
          if (stripes) logo += '<div class="color-stripes" role="img" aria-label="Destination color: ' +
            esc((STRIPES[ind.name] || []).map(function (id) { return colors[id] ? colors[id].label : ""; }).join(" and ")) + '">' + stripes + "</div>";
          var tags = (ind.commodities || [])
            .map(function (c) {
              return "<li>" + esc(c) + "</li>";
            })
            .join("");
          return (
            '<article class="industry-card">' +
            logo +
            '<div class="industry-body"><h3>' +
            esc(ind.name) +
            "</h3><p>" +
            esc(ind.blurb) +
            '</p>' +
            (tags ? '<ul class="tag-list">' + tags + "</ul>" : "") +
            (SPOTS[ind.name]
              ? '<p class="meta"><a href="../crew/industries/index.html#' + SPOTS[ind.name] + '">' +
                (ind.name === "Interchange" ? "Interchange spot sheets" : "Spot sheet") + " ›</a></p>"
              : "") +
            "</div></article>"
          );
        })
        .join("");
    });
  </script>
</body>
</html>
