<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Operator Primer (HB-01) — HART</title>
  <link rel="stylesheet" href="../css/ops.css">
</head>
<body>
  <header class="site-header" data-ops-header></header>
  <main>
    <div class="page-head">
      <h1 id="briefing-title">New Operator Primer (HB-01)</h1>
      <p class="sheet-pub"><span id="briefing-pub">HB-01 · Revision B</span> <span id="briefing-dl"></span></p>
      <p id="briefing-lede"></p>
    </div>
    <div id="briefing-body"><p class="muted">Loading…</p></div>
  </main>
  <footer class="site-footer" data-ops-footer></footer>
  <script src="../js/nav.js"></script>
  <script>
    var esc = HARTOps.esc;

    function href(rel) {
      if (/^https?:/i.test(rel) || rel.indexOf("../") === 0) return rel;
      return HARTOps.base() + rel;
    }

    // "Your first night" box at the top.
    function firstNightHtml(fn) {
      var html = '<section class="panel first-night" id="first-night">';
      if (fn.kicker) html += '<p class="box-kicker">' + esc(fn.kicker) + "</p>";
      html += "<h2>" + esc(fn.heading) + "</h2>";
      (fn.paragraphs || []).forEach(function (p) {
        html += "<p>" + esc(p) + "</p>";
      });
      if (fn.bullets && fn.bullets.length) {
        html += "<ul>" + fn.bullets.map(function (b) {
          return "<li><strong>" + esc(b.label) + ".</strong> " + esc(b.text) + "</li>";
        }).join("") + "</ul>";
      }
      if (fn.links && fn.links.length) {
        html += '<p class="small">Before you come: ' + fn.links.map(function (l) {
          return '<a href="' + href(l.href) + '">' + esc(l.label) + "</a>";
        }).join(" · ") + "</p>";
      }
      return html + "</section>";
    }

    // In-page contents for the long primer.
    function jumpHtml(items) {
      return (
        '<nav class="jump" aria-label="On this page"><ul>' +
        items.map(function (i) {
          return '<li><a href="#' + esc(i.id) + '">' + esc(i.label) + "</a></li>";
        }).join("") +
        "</ul></nav>"
      );
    }

    function arriveHtml(arrive, gallery) {
      var items = (gallery && gallery.items) || [];
      var cells = (arrive.photos || [])
        .map(function (ph) {
          var it = items.filter(function (g) {
            return String(g.src || "").indexOf(ph.match) !== -1;
          })[0];
          if (!it) return "";
          var src = /^https?:/i.test(it.src) ? it.src : HARTOps.base() + it.src;
          return (
            '<li><figure><img src="' + esc(src) + '" alt="' + esc(it.title) + '" loading="lazy">' +
            "<figcaption>" + esc(ph.caption) + "</figcaption></figure></li>"
          );
        })
        .join("");
      if (!cells) return "";
      return (
        '<section class="panel" id="arrive"><h2>' + esc(arrive.heading) + '</h2><ul class="arrive-strip">' + cells +
        '</ul><p class="small"><a href="' + href(arrive.more) + '">More photos of the room</a></p></section>'
      );
    }

    // "Who we switch": one compact placard per customer (logo, destination color, a few commodities),
    // each linking to its spot sheet, where the company history and spots are. Data: industries.json
    // for logos, stripes, and commodities; crew.json for the colors. sec.exclude drops entries by spot
    // id (Interchange is not a customer).
    // The operator sheet prints a deeper yellow; pure #FFFF00 washes out as a thin rule.
    var PRINT_HEX = { yellow: "#FFD400" };

    function logoSrc(logo) {
      if (!logo) return "";
      if (logo.indexOf("../external/") === 0) return logo.replace(/^\.\.\//, HARTOps.base() === "../" ? "../../" : "../");
      return HARTOps.base() + logo;
    }

    function placardsHtml(sec, data) {
      var colors = {};
      (data.crew.colors || []).forEach(function (c) {
        colors[c.id] = c;
      });
      var exclude = sec.exclude || [];
      return (
        '<ul class="placard-grid">' +
        (data.industries.industries || [])
          .filter(function (ind) {
            return exclude.indexOf(ind.spot) === -1;
          })
          .map(function (ind) {
            var cs = (ind.stripes || []).filter(function (id) {
              return colors[id];
            });
            var stripe = cs
              .map(function (id) {
                return '<span style="background:' + esc(PRINT_HEX[id] || colors[id].hex) + '"></span>';
              })
              .join("");
            var colorText = cs
              .map(function (id) {
                var l = colors[id].label;
                return l.charAt(0) + l.slice(1).toLowerCase();
              })
              .join(" & ");
            var comm = ind.commodities || [];
            var line = comm.slice(0, 3).join(", ") + (comm.length > 3 ? " +" + (comm.length - 3) : "");
            var src = logoSrc(ind.logo);
            return (
              '<li><a class="placard" href="' + href("crew/industries/index.html#" + ind.spot) + '">' +
              '<span class="placard-logo">' + (src ? '<img src="' + esc(src) + '" alt="" loading="lazy">' : "") + "</span>" +
              '<span class="placard-body"><strong>' + esc(ind.name) + "</strong>" +
              '<span class="placard-color">' + esc(colorText) + (cs.length > 1 ? " blocks" : " block") + "</span>" +
              '<span class="placard-goods">' + esc(line) + "</span></span>" +
              '<span class="placard-stripe" aria-hidden="true">' + stripe + "</span></a></li>"
            );
          })
          .join("") +
        "</ul>"
      );
    }

    document.addEventListener("DOMContentLoaded", async function () {
      var site = await HARTOps.mountChrome("briefing");
      var data;
      try {
        data = await HARTOps.loadJson("data/briefing.json");
      } catch (err) {
        console.error(err);
        // No static copy of HB-01 is published (docs/html/ redirects here), so point at the static pages.
        HARTOps.renderError(document.getElementById("briefing-body"), {
          what: "the primer",
          err: err,
          site: site,
          links: [
            { href: "operators/cards/index.html", label: "Car cards & waybills" },
            { href: "operators/glossary/index.html", label: "Glossary" },
            { href: "operators/index.html", label: "Operations" },
          ],
        });
        return;
      }
      document.getElementById("briefing-title").textContent = data.title;
      document.getElementById("briefing-pub").textContent = data.pub || "";
      document.getElementById("briefing-lede").textContent = data.lede || "";
      if (data.source && !site.public) {
        // The docx lives in ../external, which the public site does not carry.
        document.getElementById("briefing-dl").innerHTML =
          '· <a href="' + esc(encodeURI(HARTOps.base() + data.source)) + '">Download docx</a>';
      }
      var root = document.getElementById("briefing-body");
      var industries = null;
      if ((data.sections || []).some(function (sec) { return sec.placards; })) {
        try {
          industries = {
            industries: await HARTOps.loadJson("data/industries.json"),
            crew: await HARTOps.loadJson("data/crew.json"),
          };
        } catch (err) {
          console.error(err);
        }
      }
      var jump = [];
      if (data.firstNight) jump.push({ id: "first-night", label: "Your first night" });
      (data.sections || []).forEach(function (sec) {
        jump.push({ id: sec.id, label: sec.heading });
      });
      if (data.arrive) jump.push({ id: "arrive", label: "When you arrive" });
      jump.push({ id: "deeper", label: "Dig deeper" });
      var html = data.firstNight ? firstNightHtml(data.firstNight) : "";
      html += jumpHtml(jump);
      html += (data.sections || [])
        .map(function (sec) {
          var html = '<section class="panel" id="' + esc(sec.id) + '">';
          html += "<h2>" + esc(sec.heading) + "</h2>";
          if (sec.intro) html += '<p class="muted">' + esc(sec.intro) + "</p>";
          (sec.paragraphs || []).forEach(function (p) {
            html += "<p>" + esc(p) + "</p>";
          });
          if (sec.bullets && sec.bullets.length) {
            html += "<ul>" + sec.bullets.map(function (b) {
              return "<li>" + esc(b) + "</li>";
            }).join("") + "</ul>";
          }
          if (sec.placards && industries) html += placardsHtml(sec, industries);
          if (sec.jobs) {
            html +=
              '<div class="job-grid">' +
              sec.jobs
                .map(function (j) {
                  var code = j.href
                    ? '<a class="code" href="' + href(j.href) + '">' + esc(j.code) + "</a>"
                    : esc(j.code);
                  return (
                    '<article class="job-card"><p class="code">' + code + "</p><h3>" + esc(j.name) +
                    "</h3><p>" + esc(j.blurb) + "</p></article>"
                  );
                })
                .join("") +
              "</div>";
          }
          if (sec.blocks) {
            html +=
              '<div class="swatch-row">' +
              sec.blocks
                .map(function (b) {
                  return (
                    '<div class="swatch"><div class="chip" style="background:' + esc(b.hex) + ";color:" + esc(b.text) +
                    '">' + esc(b.color) + "</div><div>" + esc(b.dest) + '</div><div class="train">' + esc(b.train) +
                    "</div></div>"
                  );
                })
                .join("") +
              "</div>";
          }
          if (sec.link) {
            html += '<p><a href="' + href(sec.link.href) + '">' + esc(sec.link.label) + "</a></p>";
          }
          html += "</section>";
          return html;
        })
        .join("");
      if (data.arrive) {
        try {
          html += arriveHtml(data.arrive, await HARTOps.loadJson("data/gallery.json"));
        } catch (err) {
          console.error(err);
        }
      }
      var deeper = data.deeper || { heading: "If you want to dig deeper", paragraphs: [] };
      html += '<section class="panel" id="deeper"><h2>' + esc(deeper.heading) + "</h2>";
      (deeper.paragraphs || []).forEach(function (p) {
        html += "<p>" + esc(p) + "</p>";
      });
      if (deeper.refs && deeper.refs.length) {
        html += "<ul>" + deeper.refs.map(function (r) {
          return '<li><a href="' + href(r.href) + '">' + esc(r.label) + "</a></li>";
        }).join("") + "</ul>";
      }
      if (data.links && data.links.length) {
        if (deeper.linksIntro) html += "<p>" + esc(deeper.linksIntro) + "</p>";
        html +=
          "<ul>" +
          data.links
            .map(function (l) {
              return '<li><a href="' + esc(l.href) + '" target="_blank" rel="noopener">' + esc(l.label) + "</a></li>";
            })
            .join("") +
          "</ul>";
      }
      if (data.signoff) {
        var so = data.signoff;
        html +=
          '<div class="signoff"><p>' + esc(so.text) + "</p><p><strong>" + esc(so.name) + "</strong></p><p>" +
          esc(so.title) + '</p><p class="muted">' + esc(so.org) + "</p></div>";
      }
      html += "</section>";
      root.innerHTML = html;
      // The sections arrive after the browser's own jump to the hash (industries/ redirects to #industries).
      var target = location.hash && document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();
    });
  </script>
</body>
</html>
