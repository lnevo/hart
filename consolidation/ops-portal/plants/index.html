<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neville Island plants — HART</title>
  <meta name="description" content="Which company became which at the east end of Neville Island, 1899 to today: coke and iron, cement, activated carbon, and chemicals.">
  <link rel="stylesheet" href="../css/ops.css">
  <style>
    /* Lane colors follow the crew color board: Shenango black, Kosmos pink, Calgon purple, Aristech yellow. */
    .lineage-page {
      --lane: var(--brand-2);
      --coke: #2b3036;
      --cement: #b8467a;
      --carbon: #67489a;
      --chemicals: #b88a0c;
      --trunk: #1f5f8b;
    }
    .lineage-page .page-head .section-note { max-width: 62ch; margin-bottom: 0.6rem; }
    .lineage-page .page-head .small { margin: 0; }

    .year-pick {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.9rem;
      background: var(--card);
      border: 1px solid var(--rule);
      box-shadow: var(--shadow);
      padding: 0.65rem 0.9rem;
      margin: 0 0 1rem;
    }
    .year-pick label {
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 0.03em;
      color: var(--brand);
      white-space: nowrap;
    }
    .year-pick output {
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    .year-pick input[type="range"] {
      flex: 1 1 220px;
      min-width: 0;
      accent-color: var(--brand-2);
    }
    .year-pick button {
      font: inherit;
      font-size: 0.85rem;
      padding: 0.25rem 0.7rem;
      border: 1px solid var(--rule);
      background: var(--paper);
      color: var(--ink-soft);
      cursor: pointer;
    }
    .year-pick button[disabled] { opacity: 0.45; cursor: default; }

    /* —— Cards —— */
    .lin-card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--rule);
      border-top: 4px solid var(--lane);
      box-shadow: var(--shadow);
      transition: opacity 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }
    .lin-card .lin-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 4.6rem;
      padding: 0.55rem 0.8rem;
      background: linear-gradient(180deg, #ffffff 0%, #eef3f6 100%);
      border-bottom: 1px solid var(--rule);
    }
    .lin-card .lin-logo img {
      max-width: min(100%, 190px);
      max-height: 3.3rem;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .lin-card .wordmark {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      color: var(--lane);
      border: 2px solid currentColor;
      padding: 0.25rem 0.5rem;
    }
    .lin-card .lin-body { padding: 0.6rem 0.75rem 0.7rem; }
    .lin-card h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      line-height: 1.15;
      letter-spacing: 0.02em;
      margin: 0;
      color: var(--brand);
    }
    .lin-card .yrs {
      margin: 0.1rem 0 0.3rem;
      font-weight: 700;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
      color: var(--lane);
    }
    .lin-card .made { margin: 0; font-size: 0.9rem; line-height: 1.35; color: var(--ink-soft); }
    .lin-card .note { margin: 0.3rem 0 0; font-size: 0.8rem; line-height: 1.35; color: var(--muted); }
    .lin-card .under {
      margin: 0 0 0.1rem;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .has-year .lin-card { opacity: 0.38; }
    .has-year .lin-card.on {
      opacity: 1;
      transform: translateY(-2px);
      box-shadow: 0 0 0 3px var(--accent), var(--shadow);
    }

    /* —— Handoffs (connectors) —— */
    .handoff {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.2rem 0;
      color: var(--lane);
    }
    .handoff::before {
      content: "";
      width: 2px;
      height: 0.9rem;
      background: currentColor;
    }
    .handoff::after {
      content: "";
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid currentColor;
    }
    .handoff span {
      order: 0;
      display: block;
      max-width: 100%;
      margin: 0.15rem 0;
      padding: 0.15rem 0.55rem;
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid currentColor;
      border-color: var(--lane);
      border-radius: 999px;
    }

    /* —— Trunk: AS&W → Davison → PC&I → PC&C —— */
    .trunk {
      --lane: var(--trunk);
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
      align-items: stretch;
      gap: 0;
      margin: 0 0 0.2rem;
      padding: 0;
      list-style: none;
    }
    .trunk > li { min-width: 0; }
    .trunk .handoff {
      flex-direction: row;
      justify-content: center;
      width: 6.2rem;
      padding: 0 0.25rem;
    }
    .trunk .handoff::before { width: 0.5rem; height: 2px; }
    .trunk .handoff::after {
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid currentColor;
      border-right: 0;
    }
    .trunk .handoff span { border-radius: 0.6rem; font-size: 0.74rem; padding: 0.2rem 0.4rem; }

    /* —— The 1960s split —— */
    .split {
      position: relative;
      height: 4.4rem;
      margin: 0 0 0.2rem;
      color: var(--trunk);
    }
    .split .drop {
      position: absolute;
      top: 0;
      left: calc(87.5% - 1px);
      width: 2px;
      height: 1.6rem;
      background: currentColor;
    }
    .split .bar {
      position: absolute;
      top: 1.6rem;
      left: 12.5%;
      right: 12.5%;
      height: 2px;
      background: currentColor;
    }
    .split .label {
      position: absolute;
      top: 0.65rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.2rem 0.75rem;
      background: var(--brand);
      color: #fff;
      font-family: var(--font-display);
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* —— Lanes —— */
    .lanes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      align-items: start;
    }
    .lane { position: relative; }
    .lane[data-lane="coke"] { --lane: var(--coke); }
    .lane[data-lane="cement"] { --lane: var(--cement); }
    .lane[data-lane="carbon"] { --lane: var(--carbon); }
    .lane[data-lane="chemicals"] { --lane: var(--chemicals); }
    .lane-head {
      position: relative;
      text-align: center;
      padding: 0.4rem 0.5rem 0.45rem;
      background: var(--lane);
      color: #fff;
    }
    .lane-head::before {
      content: "";
      position: absolute;
      left: calc(50% - 1px);
      bottom: 100%;
      width: 2px;
      height: 2.8rem;
      background: var(--trunk);
    }
    .lane-head h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.35rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .lane-head a {
      display: inline-block;
      margin-top: 0.1rem;
      font-size: 0.78rem;
      color: #fff;
      opacity: 0.9;
    }
    .lane-steps { list-style: none; margin: 0; padding: 0; }
    .lane-steps > li:first-child { margin-top: 0.7rem; }
    .lane-end {
      margin: 0;
      padding: 0.55rem 0.7rem;
      font-size: 0.88rem;
      line-height: 1.35;
      font-weight: 600;
      border: 2px dashed var(--lane);
      background: var(--paper);
      color: var(--ink);
    }
    .lane-end b {
      display: block;
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--lane);
    }
    .lane-end.is-open { border-style: solid; }

    /* —— Year table —— */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--card);
      border: 1px solid var(--rule);
      box-shadow: var(--shadow);
      max-height: 78vh;
    }
    table.plants-table { min-width: 70rem; font-size: 0.85rem; }
    table.plants-table thead th { position: sticky; top: 0; z-index: 2; }
    table.plants-table thead th:first-child { left: 0; z-index: 3; }
    table.plants-table tbody th {
      position: sticky;
      left: 0;
      z-index: 1;
      background: var(--paper-2);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    table.plants-table td.same { color: var(--muted); }
    table.plants-table tbody tr:nth-child(even) td { background: rgba(211, 221, 229, 0.35); }
    table.plants-table tbody tr.on td,
    table.plants-table tbody tr.on th { background: #fbedc4; }
    table.plants-table .sep { border-left: 2px solid var(--rule); }
    .table-note { max-width: 70ch; color: var(--muted); font-size: 0.9rem; margin: 0.8rem 0 0; }

    .tab-panel[hidden] { display: none; }

    @media (max-width: 1040px) {
      .trunk { grid-template-columns: 1fr; max-width: 26rem; margin: 0 auto 0.2rem; }
      .trunk .handoff { flex-direction: column; width: auto; padding: 0.2rem 0; }
      .trunk .handoff::before { width: 2px; height: 0.9rem; }
      .trunk .handoff::after {
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 8px solid currentColor;
        border-bottom: 0;
      }
      .trunk .handoff span { border-radius: 999px; font-size: 0.8rem; padding: 0.15rem 0.55rem; }
      .split { height: auto; display: flex; flex-direction: column; align-items: center; }
      .split::before { content: ""; width: 2px; height: 0.9rem; background: currentColor; }
      .split .drop, .split .bar { display: none; }
      .split .label { position: static; transform: none; white-space: normal; text-align: center; }
      .split::after { content: ""; width: 2px; height: 0.9rem; background: currentColor; }
      .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.6rem 1rem; }
      .lane-head::before { display: none; }
    }
    @media (max-width: 640px) {
      .lanes { grid-template-columns: 1fr; }
      .trunk { max-width: none; }
      .year-pick label { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <header class="site-header" data-ops-header></header>
  <main class="lineage-page">
    <div class="page-head">
      <h1 id="lin-title">Who became who</h1>
      <p class="section-note" id="lin-lede"></p>
      <p class="small">The full story, with sources: <a id="lin-article" href="../library/neville-island-coke-cement-chemical-history.html">Neville Island coke, cement, and chemical history</a></p>
    </div>

    <div class="year-pick">
      <label for="year">Who ran it in <output id="year-out" for="year">…</output>?</label>
      <input type="range" id="year" min="1899" max="2016" step="1" value="1975">
      <button type="button" id="year-clear" disabled>Clear</button>
    </div>

    <div class="panel-tabs" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tab-lineage" aria-controls="panel-lineage" aria-selected="true">Lineage</button>
      <button type="button" role="tab" id="tab-years" aria-controls="panel-years" aria-selected="false">Year by year</button>
    </div>

    <section class="tab-panel" id="panel-lineage" role="tabpanel" aria-labelledby="tab-lineage">
      <ol class="trunk" id="trunk" aria-label="One company, 1899 to the 1960s"></ol>
      <div class="split" aria-hidden="true"><span class="drop"></span><span class="bar"></span><span class="label" id="split-label"></span></div>
      <div class="lanes" id="lanes"></div>
    </section>

    <section class="tab-panel" id="panel-years" role="tabpanel" aria-labelledby="tab-years" hidden>
      <div class="table-wrap"><table class="data-table plants-table" id="year-table"></table></div>
      <p class="table-note" id="table-note"></p>
    </section>
  </main>
  <footer class="site-footer" data-ops-footer></footer>
  <script src="../js/nav.js"></script>
  <script>
    (function () {
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // Logos are stored relative to the portal root ("../external/..." locally, "assets/logos/..." when built).
      function src(path) {
        return HARTOps.base() + path;
      }

      function card(c) {
        var logo = c.logo
          ? '<img src="' + esc(src(c.logo)) + '" alt="' + esc(c.name) + ' logo" loading="lazy">'
          : '<span class="wordmark">' + esc(c.wordmark || c.name) + "</span>";
        return (
          '<article class="lin-card" data-from="' + esc(c.from) + '" data-to="' + esc(c.to == null ? 9999 : c.to) + '">' +
          '<div class="lin-logo">' + logo + "</div>" +
          '<div class="lin-body">' + (c.pcc ? '<p class="under">Under PC&amp;C</p>' : "") + '<h3>' + esc(c.name) + '</h3><p class="yrs">' + esc(c.years) + "</p>" +
          '<p class="made">' + esc(c.made) + "</p>" +
          (c.note ? '<p class="note">' + esc(c.note) + "</p>" : "") +
          "</div></article>"
        );
      }

      function step(s) {
        return s.handoff
          ? '<li class="handoff"><span>' + esc(s.handoff) + "</span></li>"
          : "<li>" + card(s) + "</li>";
      }

      function lane(l) {
        var hart = l.hart
          ? '<a href="' + esc(HARTOps.base() + "industries/index.html") + '">On HART: ' + esc(l.hart) + "</a>"
          : "";
        var end = l.end
          ? '<li class="handoff"><span>Today</span></li><li><p class="lane-end' + (l.end.state === "open" ? " is-open" : "") + '"><b>' +
            (l.end.state === "open" ? "Still here" : "Ended") + "</b>" + esc(l.end.text) + "</p></li>"
          : "";
        return (
          '<section class="lane" data-lane="' + esc(l.id) + '" aria-labelledby="lane-' + esc(l.id) + '">' +
          '<div class="lane-head"><h2 id="lane-' + esc(l.id) + '">' + esc(l.title) + "</h2>" + hart + "</div>" +
          '<ol class="lane-steps">' + (l.steps || []).map(step).join("") + end + "</ol></section>"
        );
      }

      function table(t) {
        var heads = ["Years"].concat(t.headers || []);
        var prev = null;
        var body = (t.rows || [])
          .map(function (r) {
            var cells = r.cells
              .map(function (cell, i) {
                var same = prev && prev[i] === cell;
                return '<td class="' + (same ? "same" : "") + (i === 4 ? " sep" : "") + '">' + esc(cell) + "</td>";
              })
              .join("");
            prev = r.cells;
            return '<tr data-from="' + r.from + '" data-to="' + r.to + '"><th scope="row">' + esc(r.years) + "</th>" + cells + "</tr>";
          })
          .join("");
        return (
          "<thead><tr>" +
          heads.map(function (h, i) { return '<th scope="col"' + (i === 5 ? ' class="sep"' : "") + ">" + esc(h) + "</th>"; }).join("") +
          "</tr></thead><tbody>" + body + "</tbody>"
        );
      }

      // —— Year picker: highlights the cards and the table row that cover the year. ——
      var range = document.getElementById("year");
      var out = document.getElementById("year-out");
      var clear = document.getElementById("year-clear");
      var page = document.querySelector("main");

      function setYear(y) {
        var on = y != null;
        page.classList.toggle("has-year", on);
        clear.disabled = !on;
        out.textContent = on ? String(y) : "…";
        if (on) range.value = y;
        var els = document.querySelectorAll(".lin-card, #year-table tbody tr");
        for (var i = 0; i < els.length; i++) {
          var f = +els[i].getAttribute("data-from");
          var t = +els[i].getAttribute("data-to");
          els[i].classList.toggle("on", on && y >= f && y <= t);
        }
        try {
          var u = new URL(window.location.href);
          if (on) u.searchParams.set("year", y);
          else u.searchParams.delete("year");
          history.replaceState(null, "", u);
        } catch (e) {}
      }

      range.addEventListener("input", function () { setYear(+range.value); });
      clear.addEventListener("click", function () { setYear(null); });

      // —— Tabs ——
      var tabs = document.querySelectorAll('[role="tab"]');
      function showTab(id) {
        for (var i = 0; i < tabs.length; i++) {
          var sel = tabs[i].id === id;
          tabs[i].setAttribute("aria-selected", sel ? "true" : "false");
          document.getElementById(tabs[i].getAttribute("aria-controls")).hidden = !sel;
        }
      }
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].addEventListener("click", function () {
          showTab(this.id);
          try { history.replaceState(null, "", this.id === "tab-years" ? "#years" : window.location.pathname + window.location.search); } catch (e) {}
          if (this.id === "tab-years") {
            var row = document.querySelector("#year-table tr.on");
            if (row) row.scrollIntoView({ block: "center" });
          }
        });
      }

      document.addEventListener("DOMContentLoaded", async function () {
        try {
          await HARTOps.mountChrome("plants");
          var d = await HARTOps.loadJson("data/plants-lineage.json");
          if (d.title) {
            document.getElementById("lin-title").textContent = d.title;
          }
          document.getElementById("lin-lede").textContent = d.lede || "";
          if (d.article) document.getElementById("lin-article").href = HARTOps.base() + d.article;
          document.getElementById("trunk").innerHTML = (d.trunk || []).map(step).join("");
          document.getElementById("split-label").textContent = d.split || "";
          document.getElementById("lanes").innerHTML = (d.lanes || []).map(lane).join("");
          document.getElementById("year-table").innerHTML = table(d.table || {});
          document.getElementById("table-note").textContent = (d.table && d.table.note) || "";

          if (window.location.hash === "#years") showTab("tab-years");
          var q = parseInt(new URLSearchParams(window.location.search).get("year"), 10);
          setYear(q >= 1899 && q <= 2016 ? q : null);
        } catch (err) {
          console.error(err);
        }
      });
    })();
  </script>
</body>
</html>
