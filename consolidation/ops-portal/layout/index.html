<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panels — HART Operator Portal</title>
  <link rel="stylesheet" href="../css/ops.css">
</head>
<body>
  <header class="site-header" data-ops-header></header>
  <main>
    <div class="page-head">
      <h1 id="panels-title">Control panels</h1>
      <p class="muted" id="panels-lede"></p>
    </div>
    <div class="panel-tabs" id="panel-tabs" role="tablist"></div>
    <div class="panel-stage">
      <img id="panel-img" alt="Control panel">
    </div>
    <p class="panel-caption" id="panel-caption"></p>

    <div class="page-head" style="margin-top:1.5rem">
      <h2 style="font-family:var(--font-display);color:var(--brand);margin:0">Device browser</h2>
      <p class="muted" id="layout-meta">Loading device map…</p>
    </div>
    <div class="toolbar">
      <div class="panel-tabs" id="map-view-tabs" role="tablist" aria-label="Device map view">
        <button type="button" role="tab" data-map="cats" aria-selected="true">Digicon Master</button>
        <button type="button" role="tab" data-map="le" aria-selected="false">LE schematic</button>
      </div>
      <input id="layout-search" type="search" placeholder="Search name, CP, MQTT…">
      <label class="chip"><input type="checkbox" data-kind="turnout" checked> Switches</label>
      <label class="chip"><input type="checkbox" data-kind="signal" checked> Signals</label>
      <a class="btn btn-ghost" href="../roster/index.html">Open roster</a>
    </div>
    <div class="layout-workspace">
      <div class="map-scroll">
        <div id="map-stage">
          <img id="schematic" alt="Device map">
        </div>
      </div>
      <aside class="detail-panel" id="detail"></aside>
    </div>
  </main>
  <footer class="site-footer" data-ops-footer></footer>
  <script src="../js/nav.js"></script>
  <script src="../js/layout-explorer.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      await HARTOps.mountChrome("layout");
      var data = await HARTOps.loadJson("data/panels.json");
      document.getElementById("panels-title").textContent = data.title || "Panels";
      document.getElementById("panels-lede").textContent = data.lede || "";
      var panels = data.panels || [];
      var tabs = document.getElementById("panel-tabs");
      var img = document.getElementById("panel-img");
      var cap = document.getElementById("panel-caption");

      function show(i) {
        var p = panels[i];
        if (!p) return;
        img.src = HARTOps.base() + p.src;
        img.alt = p.label || "Panel";
        cap.textContent = p.caption || "";
        tabs.querySelectorAll("button").forEach(function (btn, idx) {
          btn.setAttribute("aria-selected", idx === i ? "true" : "false");
        });
      }

      tabs.innerHTML = panels
        .map(function (p, i) {
          return (
            '<button type="button" role="tab" aria-selected="' +
            (i === 0 ? "true" : "false") +
            '" data-i="' +
            i +
            '">' +
            p.label +
            "</button>"
          );
        })
        .join("");
      tabs.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          show(Number(btn.getAttribute("data-i")));
        });
      });
      show(0);

      var mapTabs = document.getElementById("map-view-tabs");
      if (mapTabs && window.HARTLayoutExplorer) {
        mapTabs.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            mapTabs.querySelectorAll("button").forEach(function (b) {
              b.setAttribute("aria-selected", b === btn ? "true" : "false");
            });
            HARTLayoutExplorer.setView(btn.getAttribute("data-map"));
          });
        });
      }
    });
  </script>
</body>
</html>
