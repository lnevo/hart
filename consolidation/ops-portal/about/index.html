<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About HART</title>
  <link rel="stylesheet" href="../css/ops.css">
  <style>
    .about-links { margin: 0.9rem 0 0; font-size: 0.95rem; }
    .about-links a { white-space: nowrap; }
  </style>
</head>
<body>
  <header class="site-header" data-ops-header></header>
  <main>
    <div class="page-head">
      <h1 id="about-title">About HART</h1>
      <p class="section-note" id="about-lede"></p>
    </div>
    <div id="about-sections"></div>
    <section class="panel">
      <h2 id="more-title"></h2>
      <div class="card-grid" id="more-grid"></div>
    </section>
  </main>
  <footer class="site-footer" data-ops-footer></footer>
  <script src="../js/nav.js"></script>
  <script>
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function link(l) {
      return '<a href="' + esc(HARTOps.base() + l.href) + '">' + esc(l.label) + "</a>";
    }
    function section(s) {
      var html = '<section class="panel"><h2>' + esc(s.heading) + '</h2><div class="prose">';
      html += (s.paragraphs || []).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
      if (s.bullets && s.bullets.length) {
        html += "<ul>" + s.bullets.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul>";
      }
      if (s.links && s.links.length) {
        html += '<p class="about-links muted">See also: ' + s.links.map(link).join(" · ") + "</p>";
      }
      return html + "</div></section>";
    }
    document.addEventListener("DOMContentLoaded", async function () {
      try {
        await HARTOps.mountChrome("about");
        var data = await HARTOps.loadJson("data/about.json");
        document.getElementById("about-title").textContent = data.title || "About HART";
        document.getElementById("about-lede").textContent = data.lede || "";
        document.getElementById("about-sections").innerHTML = (data.sections || []).map(section).join("");
        document.getElementById("more-title").textContent = data.more_title || "";
        document.getElementById("more-grid").innerHTML = (data.more || [])
          .map(function (m) {
            return '<a class="card" href="' + esc(HARTOps.base() + m.href) + '"><h3>' +
              esc(m.label) + "</h3><p>" + esc(m.blurb) + "</p></a>";
          })
          .join("");
      } catch (err) {
        console.error(err);
        document.getElementById("about-sections").innerHTML =
          '<section class="panel"><p>Could not load this page. Serve the portal over HTTP (see README).</p></section>';
      }
    });
  </script>
</body>
</html>
