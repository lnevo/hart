<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout Explorer — HART</title>
  <link rel="stylesheet" href="../css/ops.css">
</head>
<body>
  <header class="site-header" data-ops-header></header>
  <main class="explorer-page">
    <div class="page-head page-head-compact">
      <h1>Layout Explorer</h1>
      <p class="muted" id="layout-meta">Loading layout map…</p>
      <noscript><p class="small">The Layout Explorer needs JavaScript. The <a href="../crew/maps/schematic/system-schematic.pdf">system schematic (SM-01, PDF)</a> shows the whole layout with its switch numbers and masts.</p></noscript>
    </div>
    <div class="toolbar">
      <input id="layout-search" type="search" placeholder="Search switch or mast…">
      <label class="chip"><input type="checkbox" data-kind="turnout" checked> Switches</label>
      <label class="chip"><input type="checkbox" data-kind="signal" checked> Masts</label>
      <div class="zoom-controls" aria-label="Map zoom">
        <button type="button" id="zoom-out" class="btn btn-ghost" title="Zoom out">−</button>
        <input id="zoom-range" type="range" min="20" max="150" step="1" value="20" aria-label="Zoom percent">
        <button type="button" id="zoom-in" class="btn btn-ghost" title="Zoom in">+</button>
        <button type="button" id="zoom-fit" class="btn btn-ghost" title="Show the whole map">Fit</button>
        <span class="muted" id="zoom-label"></span>
      </div>
      <a class="btn btn-ghost" href="../roster/index.html">Device viewer</a>
    </div>
    <div class="map-frame">
      <div class="map-scroll map-scroll-explorer" id="map-scroll">
        <div id="map-zoom-wrap">
          <div id="map-stage">
            <img id="schematic" alt="Digicon Master device map" draggable="false">
          </div>
        </div>
      </div>
      <div class="map-overview" id="overview" hidden title="Overview: click or drag to move the view">
        <img id="overview-img" alt="" draggable="false">
        <div class="map-overview-view" id="overview-view"></div>
      </div>
    </div>
    <p class="muted small map-hint">Zoom with + and −, a trackpad pinch, Ctrl or ⌘ with the scroll wheel, or a double-click (Shift + double-click zooms out). Drag the map to move it, or use the overview in the corner.</p>
    <section class="detail-below" id="detail" aria-live="polite">
      <p class="empty">Click a switch or mast on the Digicon board.</p>
    </section>
  </main>
  <footer class="site-footer" data-ops-footer></footer>
  <script src="../js/nav.js" defer></script>
  <script src="../js/map-view.js" defer></script>
  <script src="../js/layout-explorer.js" defer></script>
</body>
</html>
