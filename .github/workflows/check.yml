# The checks a clean clone can run. Submodules stay out, and the portal build needs
# the gitignored photo mirrors, so tools/check.sh skips it here (CI=true).
name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ops/hart-ops/requirements-test.txt
      - run: ./tools/check.sh
