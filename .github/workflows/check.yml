# The checks a clean clone can run. Submodules stay out except the public schematic-maps plugin
# (for the schematic signals check), and the portal build needs
# the gitignored photo mirrors, so tools/check.sh skips it here (CI=true).
name: check
on:
  pull_request:
  push:                   # main's run saves the schematic cache every PR can restore (a PR cannot read another's)
    branches: [main]
permissions:
  contents: read
# A new push to a pull request cancels that branch's older run. A push to main has no head_ref, so each of its runs
# gets a group of its own and is never cancelled (it saves the schematic cache).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 'git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init external/model-railroad-skills'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ops/hart-ops/requirements-test.txt
      - run: pip install -r ops/hart-ops/requirements-test.txt
      # The schematic plugin's cache (tools/check.sh sets SCHEMATIC_CACHE to this folder). Each entry in it is keyed
      # on everything its solve reads, so an old one is never used for changed inputs; this key only decides when a
      # run saves a new copy (the plugin, the builders or their data changed).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hart/schematic
          key: schematic-${{ hashFiles('external/model-railroad-skills/plugins/schematic-maps/schematic/**', 'tools/schematic/**', 'jmri/layouts/hart/data/**', 'jmri/layouts/hart/output/tables.xml') }}
          restore-keys: schematic-
      - run: ./tools/check.sh
        env:
          SCHEMATIC_REQUIRED: "1"
