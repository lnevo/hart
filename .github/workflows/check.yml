# The checks a clean clone can run. Submodules stay out except the public schematic-maps plugin
# (for the schematic signals check), and the portal build needs
# the gitignored photo mirrors, so tools/check.sh skips it here (CI=true).
name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tests read the last hand-drawn tables from git (hartlib.hand_drawn)
      - run: 'git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init external/model-railroad-skills'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ops/hart-ops/requirements-test.txt
      # The schematic plugin's cache (tools/check.sh sets SCHEMATIC_CACHE to this folder): a solved sheet is keyed on
      # everything it reads, so an old entry is never used for changed inputs. Each run saves its own copy.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hart/schematic
          key: schematic-${{ github.run_id }}
          restore-keys: schematic-
      - run: ./tools/check.sh
        env:
          SCHEMATIC_REQUIRED: "1"
