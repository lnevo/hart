# The checks a clean clone can run. Submodules stay out except the public schematic-maps plugin
# (for the schematic signals check), and the portal build needs
# the gitignored photo mirrors, so tools/check.sh skips it here (CI=true).
name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 'git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init external/model-railroad-skills'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ops/hart-ops/requirements-test.txt
      - run: ./tools/check.sh
