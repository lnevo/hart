# The checks a clean clone can run. Submodules stay out because hart-ops is
# private, so tools/check.sh skips the portal build here (CI=true).
name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./tools/check.sh
