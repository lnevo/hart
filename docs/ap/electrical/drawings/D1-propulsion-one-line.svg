<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" width="1000" height="312" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">D1 · Propulsion one-line: control, power and protection</title><desc id="d">Block diagram. Throttles feed the command station, which sends the DCC signal to the booster. The command station and booster feed a booster matrix, which feeds four circuit breakers and two auto-reversers. Each feeds its own district bus.</desc>
<rect width="1000" height="312" fill="#fff"/>
<rect x="20" y="40" width="150" height="50" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="95.0" y="56.7" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#121a22">DCC throttles</text>
<text x="95.0" y="68.2" font-size="9.5" text-anchor="middle" fill="#121a22">speed and direction</text>
<text x="95.0" y="79.7" font-size="9.5" text-anchor="middle" fill="#121a22">per locomotive address</text>
<rect x="220" y="40" width="170" height="50" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="305.0" y="56.7" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#121a22">Command station</text>
<text x="305.0" y="68.2" font-size="9.5" text-anchor="middle" fill="#121a22">TCS CS-105</text>
<text x="305.0" y="79.7" font-size="9.5" text-anchor="middle" fill="#121a22">(also a track output)</text>
<rect x="220" y="120" width="170" height="50" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="305.0" y="136.7" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#121a22">Booster</text>
<text x="305.0" y="148.2" font-size="9.5" text-anchor="middle" fill="#121a22">TCS B-106 (a second</text>
<text x="305.0" y="159.7" font-size="9.5" text-anchor="middle" fill="#121a22">is planned if needed)</text>
<path d="M170,65 L220,65" fill="none" stroke="#1f5fa8" stroke-width="1.8"/>
<text x="176" y="58" font-size="8.5" fill="#1f5fa8" text-anchor="start" font-weight="normal">throttle bus</text>
