<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">D5 · Reversing section on an auto-reverser</title><desc id="d">A section of track gapped in both rails at both ends, fed through an auto-reverser that swaps its polarity when a train crosses a gap.</desc>
<rect width="720" height="364" fill="#fff"/>
<path d="M40,66 L700,66" fill="none" stroke="#b03a2e" stroke-width="2.2"/>
<path d="M40,80 L700,80" fill="none" stroke="#121a22" stroke-width="2.2"/>
<text x="44" y="58" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">DCC from the booster matrix (D1)</text>
<rect x="260" y="110" width="240" height="46" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="380.0" y="130.3" font-size="10" text-anchor="middle" font-weight="bold" fill="#121a22">Auto-reverser</text>
<text x="380.0" y="142.3" font-size="10" text-anchor="middle" fill="#121a22">AR-10 (RS-1) or PSX-AR (RS-2)</text>
<path d="M360,80 L360,110" fill="none" stroke="#121a22" stroke-width="1.4"/>
<path d="M400,66 L400,110" fill="none" stroke="#b03a2e" stroke-width="1.4"/>
<path d="M160,246 L600,246 M160,254 L600,254" stroke="#b03a2e" stroke-width="2"/>
<path d="M60,246 L156,246 M60,254 L156,254" stroke="#5f6e7a" stroke-width="1.6"/>
<path d="M604,246 L700,246 M604,254 L700,254" stroke="#5f6e7a" stroke-width="1.6"/>
<path d="M155,241 L155,259 M161,241 L161,259" stroke="#b03a2e" stroke-width="2.4"/>
<path d="M599,241 L599,259 M605,241 L605,259" stroke="#b03a2e" stroke-width="2.4"/>
<text x="380" y="278" font-size="10" fill="#b03a2e" text-anchor="middle" font-weight="bold">Reversing section: both rails gapped at both ends</text>
<text x="380" y="292" font-size="9.5" fill="#5f6e7a" text-anchor="middle" font-weight="normal">(longer than the longest train)</text>
<path d="M350,156 L350,246" fill="none" stroke="#b03a2e" stroke-width="1.4"/>
<path d="M410,156 L410,254" fill="none" stroke="#121a22" stroke-width="1.4"/>
<circle cx="350" cy="246" r="3" fill="#b03a2e"/><circle cx="410" cy="254" r="3" fill="#121a22"/>
<ellipse cx="380" cy="200" rx="42" ry="9" fill="none" stroke="#1f5fa8" stroke-width="2"/>
<text x="430" y="204" font-size="9.5" fill="#1f5fa8" text-anchor="start" font-weight="normal">both feeders through one DNCT2B channel, as D2</text>
<text x="60" y="234" font-size="9" fill="#5f6e7a" text-anchor="start" font-weight="normal">normal section</text>
<text x="620" y="234" font-size="9" fill="#5f6e7a" text-anchor="start" font-weight="normal">normal section</text>
<text x="20" y="320" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">When a train&#x27;s wheels bridge a gap with the polarity wrong, the auto-reverser sees the short and swaps the section&#x27;s two</text>
<text x="20" y="334" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">outputs in milliseconds, before any breaker trips; on a lasting short it cuts the section off like a breaker. Two sections</text>
<text x="20" y="348" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">are wired this way: RS-1 on the west main line and RS-2, the return loop (Plan P2).</text>
</svg>
