<text x="380" y="278" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="bold">Reversing section: both rails gapped at both ends</text>
<text x="380" y="292" font-size="9.5" fill="#6b7a86" text-anchor="middle" font-weight="normal">(longer than the longest train)</text>
