<circle cx="350" cy="246" r="3" fill="#c0392b"/><circle cx="410" cy="254" r="3" fill="#121a22"/>
<circle cx="350" cy="200" r="10" fill="none" stroke="#1f5fa8" stroke-width="2"/>
<text x="366" y="204" font-size="9.5" fill="#1f5fa8" text-anchor="start" font-weight="normal">DNCT2B detector on the feeder, as D2</text>
<text x="60" y="234" font-size="9" fill="#6b7a86" text-anchor="start" font-weight="normal">normal section</text>
<text x="620" y="234" font-size="9" fill="#6b7a86" text-anchor="start" font-weight="normal">normal section</text>
<text x="20" y="320" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">When a train&#x27;s wheels bridge a gap with the polarity wrong, the short is seen by the auto-reverser, which swaps the section&#x27;s two</text>
<text x="20" y="334" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">outputs in milliseconds, faster than the district&#x27;s breaker trips. Two sections are wired this way: Main West, and the K-1 / K-2 loop</text>
<text x="20" y="348" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">at Princess (D1).</text>
