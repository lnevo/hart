<rect x="20" y="50" width="120" height="46" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="80.0" y="70.3" font-size="10" text-anchor="middle" font-weight="bold" fill="#121a22">Command station</text>
<text x="80.0" y="82.3" font-size="10" text-anchor="middle" fill="#121a22">and boosters (D1)</text>
<rect x="190" y="50" width="130" height="46" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="255.0" y="70.3" font-size="10" text-anchor="middle" font-weight="bold" fill="#121a22">Protection device</text>
<text x="255.0" y="82.3" font-size="10" text-anchor="middle" fill="#121a22">breaker or auto-reverser</text>
<path d="M140,73 L190,73" fill="none" stroke="#121a22" stroke-width="2"/>
