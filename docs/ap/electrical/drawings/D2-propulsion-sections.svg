<text x="672" y="94" font-size="9" fill="#1f5fa8" text-anchor="start" font-weight="normal">network cable</text>
<text x="20" y="300" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">The DNCT2B senses the current</text>
<text x="20" y="313" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">on each output, so a train in</text>
<text x="20" y="326" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">a section shows as occupied.</text>
<text x="20" y="360" font-size="10" fill="#121a22" text-anchor="start" font-weight="bold">All 43 detected sections on the staging level and helix are wired this way; Appendix B lists them.</text>
