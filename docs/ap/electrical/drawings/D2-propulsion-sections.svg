<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 376" width="920" height="376" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">D2 · Propulsion: typical detected section</title><desc id="d">The district bus, both rails, feeds the rail input of a DNCT2B detector. Each of its two outputs feeds the feeder pair of one section, gapped in both rails at both ends. The DNCT2B connects to a DNCTA, which links up to four DNCT2Bs to an LCOS client node.</desc>
