<text x="600" y="163" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">same sensor channel; each section has at least</text>
<text x="600" y="176" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">one feeder pair. One DNCT2B serves two sections.</text>
<text x="20" y="304" font-size="10" fill="#121a22" text-anchor="start" font-weight="bold">All 43 detected sections on the staging level and helix are wired this way; Appendix B lists them.</text>
