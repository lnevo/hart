<text x="85.0" y="72.3" font-size="10" text-anchor="middle" fill="#121a22">and booster (D1)</text>
<rect x="190" y="40" width="140" height="46" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="260.0" y="60.3" font-size="10" text-anchor="middle" font-weight="bold" fill="#121a22">Protection device</text>
<text x="260.0" y="72.3" font-size="10" text-anchor="middle" fill="#121a22">breaker or auto-reverser</text>
