<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">D2 · Propulsion: typical detected section</title><desc id="d">A district bus of two wires runs from its protection device. A feeder pair drops to one section of track, gapped in both rails at both ends. Both feeders pass through one channel of a DNCT2B current sensor, which reports occupied or clear to an LCOS control node.</desc>
