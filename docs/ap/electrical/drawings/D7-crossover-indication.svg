<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 560" width="740" height="560" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">D7 · Crossover position indication: two contacts on one input pair</title><desc id="d">The position contacts of the two crossover machines, wired so the normal input closes only when both halves are normal and the reverse input only when both are reverse. If the halves disagree, neither input closes and the panel shows the crossover as inconsistent.</desc>
<rect width="740" height="560" fill="#fff"/>
<circle cx="170" cy="190" r="4" fill="#fff" stroke="#121a22" stroke-width="1.6"/><circle cx="240" cy="160" r="4" fill="#fff" stroke="#121a22" stroke-width="1.6"/><circle cx="240" cy="220" r="4" fill="#fff" stroke="#121a22" stroke-width="1.6"/><path d="M170,190 L235,164" fill="none" stroke="#121a22" stroke-width="2.4"/><text x="160" y="194" font-size="10" fill="#121a22" text-anchor="end" font-weight="bold">C</text><text x="254" y="152" font-size="10" fill="#121a22" text-anchor="middle" font-weight="bold">N</text><text x="240" y="240" font-size="10" fill="#121a22" text-anchor="middle" font-weight="bold">R</text>
<circle cx="570" cy="190" r="4" fill="#fff" stroke="#121a22" stroke-width="1.6"/><circle cx="500" cy="160" r="4" fill="#fff" stroke="#121a22" stroke-width="1.6"/><circle cx="500" cy="220" r="4" fill="#fff" stroke="#121a22" stroke-width="1.6"/><path d="M570,190 L505,164" fill="none" stroke="#121a22" stroke-width="2.4"/><text x="580" y="194" font-size="10" fill="#121a22" text-anchor="start" font-weight="bold">C</text><text x="486" y="152" font-size="10" fill="#121a22" text-anchor="middle" font-weight="bold">N</text><text x="500" y="240" font-size="10" fill="#121a22" text-anchor="middle" font-weight="bold">R</text>
<rect x="20" y="250" width="130" height="34" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="85.0" y="264.5" font-size="9" text-anchor="middle" font-weight="bold" fill="#121a22">Half a: MP4 contact 2</text>
<text x="85.0" y="275.5" font-size="9" text-anchor="middle" fill="#121a22">shown normal</text>
<rect x="590" y="250" width="130" height="34" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="655.0" y="264.5" font-size="9" text-anchor="middle" font-weight="bold" fill="#121a22">Half b: MP4 contact 2</text>
<text x="655.0" y="275.5" font-size="9" text-anchor="middle" fill="#121a22">shown normal</text>
<rect x="30" y="50" width="150" height="40" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="105.0" y="67.4" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#121a22">Node input: N</text>
<text x="105.0" y="78.9" font-size="9.5" text-anchor="middle" fill="#121a22">FB Switch n N</text>
<rect x="560" y="50" width="150" height="40" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="635.0" y="67.4" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#121a22">Node input: R</text>
<text x="635.0" y="78.9" font-size="9.5" text-anchor="middle" fill="#121a22">FB Switch n R</text>
<rect x="295" y="50" width="150" height="40" rx="3" fill="#e4ebf0" stroke="#121a22"/>
<text x="370.0" y="67.4" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#121a22">Node input common</text>
<text x="370.0" y="78.9" font-size="9.5" text-anchor="middle" fill="#121a22"></text>
<path d="M240,160 L240,70 L180,70" fill="none" stroke="#1f5fa8" stroke-width="2.2"/>
<path d="M170,190 L170,330 L570,330 L570,190" fill="none" stroke="#1f5fa8" stroke-width="2.2"/>
<path d="M500,160 L500,120 L420,120 L420,90" fill="none" stroke="#1f5fa8" stroke-width="2.2"/>
<path d="M240,220 L300,220 L300,90" fill="none" stroke="#121a22" stroke-width="1.5"/>
<path d="M500,220 L660,220 L660,90" fill="none" stroke="#121a22" stroke-width="1.5"/>
<text x="370" y="346" font-size="9.5" fill="#121a22" text-anchor="middle" font-weight="normal">commons of the two contacts tied together</text>
<text x="30" y="384" font-size="9.5" fill="#1f5fa8" text-anchor="start" font-weight="normal">Blue: the path that closes when both halves are normal (N input to common through a and b in series).</text>
<text x="30" y="418" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="bold">Half a</text>
<text x="120" y="418" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="bold">Half b</text>
<text x="210" y="418" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="bold">N input</text>
<text x="300" y="418" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="bold">R input</text>
<text x="390" y="418" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="bold">Panel shows</text>
<text x="30" y="435" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Normal</text>
<text x="120" y="435" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Normal</text>
<text x="210" y="435" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">closed</text>
<text x="300" y="435" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">open</text>
<text x="390" y="435" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Normal</text>
<text x="30" y="452" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Reverse</text>
<text x="120" y="452" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Reverse</text>
<text x="210" y="452" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">open</text>
<text x="300" y="452" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">closed</text>
<text x="390" y="452" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Reverse</text>
<text x="30" y="469" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Normal</text>
<text x="120" y="469" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Reverse</text>
<text x="210" y="469" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">open</text>
<text x="300" y="469" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">open</text>
<text x="390" y="469" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Inconsistent (N and R inputs joined, no common)</text>
<text x="30" y="486" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Reverse</text>
<text x="120" y="486" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Normal</text>
<text x="210" y="486" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">open</text>
<text x="300" y="486" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">open</text>
<text x="390" y="486" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">Inconsistent (only the common is connected)</text>
<text x="30" y="516" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">JMRI reads each crossover with two-sensor feedback (FB Switch n N and R). When the halves disagree neither</text>
<text x="30" y="530" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">sensor is active, so the panel shows the switch as Inconsistent and no Normal or Reverse light is lit. Used on the</text>
<text x="30" y="544" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">crossovers at Switches 7, 23 and 35.</text>
</svg>
