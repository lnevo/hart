<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" width="620" height="500" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<rect width="620" height="500" fill="#fff"/>
<text x="12" y="20" font-size="13" font-weight="bold" fill="#121a22">D3 · Turnout: powered frog and panel indication (MTB MP4, two SPDT)</text>
<path d="M60,206 L560,206 M60,214 L560,214" stroke="#121a22" stroke-width="1.6"/>
<path d="M300,206 L520,114" fill="none" stroke="#121a22" stroke-width="1.6"/>
<path d="M300,214 L528,122" fill="none" stroke="#121a22" stroke-width="1.6"/>
<text x="62" y="234" font-size="9.5" fill="#6b7a86" text-anchor="start" font-weight="normal">stock rails</text>
<path d="M398,184 L420,170 L460,206 M420,170 L464,152" stroke="#c0392b" stroke-width="3" fill="none"/>
<text x="450" y="146" font-size="10" fill="#c0392b" text-anchor="start" font-weight="bold">frog (insulated, powered)</text>
<path d="M478,198 L478,222 M484,198 L484,222" stroke="#121a22" stroke-width="2.4"/>
<path d="M488,136 L500,124 M494,142 L506,130" stroke="#121a22" stroke-width="2.4"/>
<text x="490" y="236" font-size="9.5" fill="#6b7a86" text-anchor="start" font-weight="normal">gaps in both frog rails</text>
<rect x="110" y="300" width="200" height="124" fill="#f3f6f8" stroke="#121a22"/>
<text x="210" y="318" font-size="10.5" fill="#121a22" text-anchor="middle" font-weight="bold">MTB MP4 switch machine</text>
<text x="124" y="340" font-size="10" fill="#121a22" text-anchor="start" font-weight="bold">SPDT 1: frog power</text>
<circle cx="150" cy="362" r="3" fill="#121a22"/><circle cx="200" cy="352" r="3" fill="#121a22"/><circle cx="200" cy="372" r="3" fill="#121a22"/>
<path d="M150,362 L198,353" fill="none" stroke="#121a22" stroke-width="1.6"/>
<text x="124" y="366" font-size="9" fill="#6b7a86" text-anchor="start" font-weight="normal">C</text>
<path d="M200,352 L250,352 L250,214" fill="none" stroke="#121a22" stroke-width="1.3"/>
<path d="M200,372 L270,372 L270,206" fill="none" stroke="#c0392b" stroke-width="1.3"/>
<circle cx="250" cy="214" r="3" fill="#121a22"/><circle cx="270" cy="206" r="3" fill="#c0392b"/>
<path d="M150,362 L140,362 L140,280 L420,280 L420,172" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<text x="150" y="274" font-size="9.5" fill="#c0392b" text-anchor="start" font-weight="normal">common to the frog</text>
<text x="278" y="292" font-size="9.5" fill="#6b7a86" text-anchor="start" font-weight="normal">throws to the two stock rails</text>
<text x="124" y="396" font-size="10" fill="#121a22" text-anchor="start" font-weight="bold">SPDT 2: panel indication</text>
<circle cx="150" cy="408" r="3" fill="#121a22"/><circle cx="200" cy="402" r="3" fill="#121a22"/><circle cx="200" cy="414" r="3" fill="#121a22"/>
<path d="M150,408 L198,403" fill="none" stroke="#121a22" stroke-width="1.6"/>
<rect x="380" y="380" width="170" height="44" fill="#e4ebf0" stroke="#121a22"/>
<text x="465.0" y="399.5" font-size="9" text-anchor="middle" font-weight="bold" fill="#121a22">Panel indication</text>
<text x="465.0" y="410.5" font-size="9" text-anchor="middle" fill="#121a22">Touch Toggle LED, normal / reverse</text>
<path d="M200,402 L380,396" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
<path d="M200,414 L380,410" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
<rect x="380" y="316" width="170" height="44" fill="#e4ebf0" stroke="#121a22"/>
<text x="465.0" y="335.5" font-size="9" text-anchor="middle" font-weight="bold" fill="#121a22">Motor drive</text>
<text x="465.0" y="346.5" font-size="9" text-anchor="middle" fill="#121a22">LCOS 12 V output</text>
<path d="M310,338 L380,338" fill="none" stroke="#121a22" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="20" y="456" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">The frog always takes the polarity of the stock rail its points lie against, because the same throw of the machine that moves</text>
<text x="20" y="470" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">the points also moves the SPDT 1 contact. Every staging turnout is wired this way. Indication follows the machine, so it is</text>
<text x="20" y="484" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">correct whether the turnout is thrown from the panel, a DCC throttle or the computer.</text>
</svg>
