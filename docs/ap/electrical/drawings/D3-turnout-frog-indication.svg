<text x="124" y="396" font-size="10" fill="#121a22" text-anchor="start" font-weight="bold">SPDT 2: panel indication</text>
<circle cx="150" cy="410" r="3" fill="#121a22"/><circle cx="200" cy="402" r="3" fill="#121a22"/><circle cx="200" cy="416" r="3" fill="#121a22"/>
