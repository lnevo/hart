<text x="475.0" y="410.5" font-size="9" text-anchor="middle" fill="#121a22">Touch Toggle LED: normal / reverse</text>
<path d="M200,402 L380,396" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
<path d="M200,416 L380,410" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
