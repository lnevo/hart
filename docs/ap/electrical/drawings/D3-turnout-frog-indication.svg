<rect x="380" y="316" width="190" height="44" fill="#e4ebf0" stroke="#121a22"/>
<text x="475.0" y="335.5" font-size="9" text-anchor="middle" font-weight="bold" fill="#121a22">Motor drive</text>
<text x="475.0" y="346.5" font-size="9" text-anchor="middle" fill="#121a22">LCOS 12 V output</text>
<path d="M310,338 L380,338" fill="none" stroke="#121a22" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="20" y="472" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">The frog always takes the polarity of the stock rail its points lie against, because the same throw of the machine that moves</text>
<text x="20" y="486" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">the points also moves the SPDT 1 contact. Every staging turnout is wired this way. Indication follows the machine, so it is</text>
<text x="20" y="500" font-size="9.5" fill="#121a22" text-anchor="start" font-weight="normal">correct whether the turnout is thrown from the panel, a DCC throttle or the computer.</text>
</svg>
