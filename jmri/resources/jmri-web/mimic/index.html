<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HART LCOS mimic</title>
  <link rel="stylesheet" href="mimic.css" />
  <script src="mimic_view.js"></script>
</head>
<body data-heads-title="Signal heads (live from JMRI)">
  <footer>
    Served by JMRI. State comes from the JMRI JSON WebSocket; clicks go to <code>mimic_relay.py</code>,
    which publishes LCOS status <code>track/turnout/{addr}</code> (plus FB N/R sensors for TWOSENSOR plants)
    and occupancy <code>track/sensor/{addr}</code>, retained. It never publishes <code>track/cmd</code> (motors stay put).
  </footer>
  <script>
    // Markup, style and render() come from mimic_view.js and mimic.css; this script is the transport.
    mountMimic();

    // --- JMRI JSON WebSocket (state) and mimic_relay.py (LCOS feedback) ---------------
    const MEMORY = "IMHART_MIMIC";
    const SENSOR = { 2: "ACTIVE", 4: "INACTIVE", 8: "INCONSISTENT" };
    const TURNOUT = { 2: "CLOSED", 4: "THROWN", 8: "INCONSISTENT" };
    let ws = null;
    let pingTimer = 0;
    let seq = Date.now();
    let relayReady = false;
    let relayTimer = 0;

    function status(ok, text) {
      $("mqtt-dot").className = "dot " + (ok === true ? "ok" : ok === false ? "bad" : "");
      $("mqtt-label").textContent = text;
    }

    function showStatus() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      status(relayReady, relayReady
        ? `JMRI ${location.host}`
        : `JMRI ${location.host} · mimic relay not running (clicks do nothing)`);
    }

    function leaf(name, prefix) {
      return name.startsWith(prefix) ? name.slice(prefix.length) : null;
    }

    function headAspect(d) {
      if (!d.lit) return "Dark";
      return String(d.appearanceName || "Dark").replace(/\s+/g, "");
    }

    function onData(msg) {
      const d = msg.data || {};
      if (msg.type === "hello") {
        clearInterval(pingTimer);
        const beat = Math.max(2000, (d.heartbeat || 13500) * 0.8);
        pingTimer = setInterval(() => send({ type: "ping" }), beat);
        return false;
      }
      if (msg.type === "sensor") {
        const addr = leaf(d.name || "", "M2S");
        if (addr) state.sensors[addr] = SENSOR[d.state] || "";
        return true;
      }
      if (msg.type === "turnout") {
        const addr = leaf(d.name || "", "M2T");
        if (addr) state.turnouts[addr] = TURNOUT[d.state] || "";
        return true;
      }
      if (msg.type === "signalHead") {
        const packed = (d.name || "").replace(/^IH/i, "");
        state.heads[packed] = headAspect(d);
        return true;
      }
      if (msg.type === "memory" && d.name === MEMORY) {
        // Only the relay writes "ack <n>"; the memory merely existing proves nothing.
        if (String(d.value || "").startsWith("ack ")) {
          relayReady = true;
          showStatus();
        }
        return false;
      }
      if (msg.type === "error" && String(d.message || "").includes(`"${MEMORY}"`)) {
        relayReady = false;
        showStatus();
      }
      return false;
    }

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
        return true;
      }
      return false;
    }

    function subscribeAll() {
      const L = state.layout;
      const names = { sensor: new Set(), turnout: new Set(), signalHead: new Set() };
      for (const b of L.blocks) names.sensor.add("M2S" + b.addr);
      for (const t of L.turnouts) {
        names.turnout.add("M2T" + t.addr);
        if (t.n_addr) names.sensor.add("M2S" + t.n_addr);
        if (t.r_addr) names.sensor.add("M2S" + t.r_addr);
      }
      for (const h of L.heads) names.signalHead.add(h.systemName || "IH" + h.id);
      for (const [type, set] of Object.entries(names)) {
        for (const name of set) send({ type, data: { name } });
      }
      send({ type: "memory", data: { name: MEMORY } });
    }

    // Ask until the relay answers: it may start after the page connects (Pi boot).
    function pingRelay() {
      clearInterval(relayTimer);
      const ask = () => {
        if (relayReady) { clearInterval(relayTimer); return; }
        seq += 1;
        send({ type: "memory", data: { name: MEMORY } });
        send({ type: "memory", method: "post", data: { name: MEMORY, value: `${seq}\nping` } });
      };
      ask();
      relayTimer = setInterval(ask, 5000);
    }

    function connect() {
      status(null, "connecting…");
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/json/`);
      let renderTimer = 0;
      ws.onopen = () => {
        subscribeAll();
        status(true, `JMRI ${location.host} · waiting for mimic relay…`);
        pingRelay();
      };
      ws.onmessage = (m) => {
        let msgs;
        try { msgs = JSON.parse(m.data); } catch (err) { return; }
        let dirty = false;
        for (const msg of Array.isArray(msgs) ? msgs : [msgs]) dirty = onData(msg) || dirty;
        if (dirty) {
          clearTimeout(renderTimer);
          renderTimer = setTimeout(render, 150);
        }
      };
      ws.onclose = () => {
        clearInterval(pingTimer);
        clearInterval(relayTimer);
        relayReady = false;
        status(false, "JMRI disconnected, retrying…");
        setTimeout(connect, 2000);
      };
    }

    // One request = one memory value; mimic_relay.py publishes each line, retained.
    function relay(lines) {
      if (!relayReady) {
        alert("The mimic relay is not running in JMRI, so nothing was sent.");
        return;
      }
      seq += 1;
      send({ type: "memory", method: "post", data: { name: MEMORY, value: [String(seq), ...lines].join("\n") } });
    }

    document.addEventListener("click", (e) => {
      const to = e.target.closest("[data-to]");
      if (to) {
        const t = state.layout.turnouts.find((x) => x.addr === to.dataset.to);
        const thrown = to.dataset.st === "THROWN";
        const lines = [];
        if (t && t.n_addr && t.r_addr) {
          lines.push(`track/sensor/${t.n_addr} ${thrown ? "INACTIVE" : "ACTIVE"}`);
          lines.push(`track/sensor/${t.r_addr} ${thrown ? "ACTIVE" : "INACTIVE"}`);
        }
        lines.push(`track/turnout/${to.dataset.to} ${to.dataset.st}`);
        relay(lines);
        return;
      }
      const occ = e.target.closest("[data-occ]");
      if (occ) relay([`track/sensor/${occ.dataset.occ} ${occ.dataset.st}`]);
    });

    $("clear-occ").addEventListener("click", () => {
      if (!confirm("Set every occupancy sensor INACTIVE?")) return;
      relay(state.layout.blocks.map((b) => `track/sensor/${b.addr} INACTIVE`));
    });

    async function boot() {
      try {
        state.layout = await fetch("mimic_layout.json", { cache: "no-store" }).then((r) => {
          if (!r.ok) throw new Error(r.status + " " + r.statusText);
          return r.json();
        });
      } catch (err) {
        status(false, "mimic_layout.json missing: " + err.message);
        return;
      }
      render();
      connect();
    }
    boot();
  </script>
</body>
</html>
